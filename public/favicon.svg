<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Camera body -->
  <rect x="4" y="10" width="24" height="16" rx="3" ry="3" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  
  <!-- Camera lens -->
  <circle cx="16" cy="18" r="6" fill="#374151" stroke="#6b7280" stroke-width="1"/>
  <circle cx="16" cy="18" r="4" fill="#111827"/>
  <circle cx="16" cy="18" r="2" fill="#4b5563"/>
  
  <!-- Camera top -->
  <rect x="8" y="6" width="16" height="4" rx="1" ry="1" fill="#374151"/>
  
  <!-- Viewfinder -->
  <rect x="12" y="4" width="8" height="2" rx="1" ry="1" fill="#6b7280"/>
  
  <!-- Flash -->
  <rect x="22" y="8" width="2" height="2" rx="0.5" ry="0.5" fill="#fbbf24"/>
  
  <!-- Lens reflection -->
  <circle cx="14.5" cy="16.5" r="1.5" fill="#9ca3af" opacity="0.7"/>
</svg>
